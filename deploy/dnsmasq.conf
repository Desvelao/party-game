# DHCP and DNS for the party-box Wi-Fi: every name resolves to the box, so phones land on the game.
interface=wlan0
bind-interfaces
dhcp-range=192.168.4.10,192.168.4.200,255.255.255.0,12h
dhcp-option=option:router,192.168.4.1
dhcp-option=option:dns-server,192.168.4.1
address=/#/192.168.4.1
no-resolv
