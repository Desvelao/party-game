    #   spawnDelayVariance: 1      # Spawn delay variance: 0–4, step 0.1, s
    #   ballSpawnEvery: 15         # Ball spawn interval: 3–60, step 1, s
    #   ballSpawnVariance: 6       # Ball spawn variance: 0–30, step 1, s
    #   maxBalls: 4                # Maximum balls: 0–16, step 1
    #   ballCollisions: true       # Ball collisions: true | false
    #   timeLimit: 150             # Time limit: 30–300, step 10, s
    #   roundsToWin: 3             # Rounds to win: 1–10, step 1

