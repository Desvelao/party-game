# Party game server configuration.
#
# Start the server with:   node dist/server.js -c config.yaml
# The file is also found through $PARTY_GAME_CONFIG, or at /etc/party-game/config.yaml.
#
# Everything is optional. A value set here overrides the matching environment variable
# (shown in the comments), which overrides the hardware profile default. Unknown sections
# or keys and out-of-range values stop the server at startup with a message.
# Every duration in this file is in whole seconds (the environment variables
# JOIN_TIMEOUT_MS and PING_INTERVAL_MS keep their millisecond unit).
# The values below are the defaults of the NORMAL profile.

server:                       # how the process listens and serves
  host: 0.0.0.0               # HOST
  port: 8080                  # PORT
  staticDir: dist/client      # STATIC_DIR: the built client
  tlsCert: ""                 # TLS_CERT: PEM certificate file; with tlsKey set, the page and wss are served over HTTPS (both empty: plain HTTP, see docs/manual/https.md)
  tlsKey: ""                  # TLS_KEY: PEM private key file that goes with tlsCert
  trustProxy: false           # TRUST_PROXY=1|true|yes: client IP = last X-Forwarded-For entry (only behind one proxy you control that appends the peer)
  publicUrl: ""               # PUBLIC_URL: address phones should use in the join link and QR (e.g. http://partygame.local); empty: taken from the request
  captivePortal: false        # CAPTIVE_PORTAL=1|true|yes: party-box mode, phones that join the box's Wi-Fi are sent to the game (docs/party-box.md)
  consoleMode: false          # off by default. CONSOLE_MODE=1|true|yes: a TV (/tv) owns a room, a phone paired with its PIN (/console) is the host and admin (docs/party-box.md)
  consoleScreenAny: false     # CONSOLE_SCREEN_ANY=1: any address may open the TV room (development only; default: the machine itself)
  adminInsights: true         # ADMIN_INSIGHTS=0|1: keep match history, player reports and the metrics chart for the admin page (false: lighter, those endpoints answer 404)
  adminToken: ""              # ADMIN_TOKEN: bearer token for /api/admin/* and /stats?reset=1 (empty: loopback only)

performance:                  # sizing for the hardware
  profile: NORMAL             # PROFILE: LOW_POWER | NORMAL | HIGH, the base for the keys below
  tickRate: 60                # TICK_RATE: simulation steps per second (10-120)
  networkRate: 20             # NET_RATE: snapshots per second sent to clients (1-60)
  maxRooms: 4                 # MAX_ROOMS (1-64)
  maxPlayersPerRoom: 8        # MAX_PLAYERS (1-32)
  maxSpectatorsPerRoom: 8     # MAX_SPECTATORS (0-64)

game:                         # match rules and room lifecycle
  idleRoomSeconds: 600        # IDLE_ROOM_SECONDS: close idle lobbies after this long (0 = never)
  roomRestoreSeconds: 900     # ROOM_RESTORE_SECONDS: keep open lobbies across a restart for this long (0 = off)
  idleWarnSeconds: 60         # IDLE_WARN_SECONDS: warn players this long before that (0 = no warning)
  hostIdleSeconds: 90         # HOST_IDLE_SECONDS: an idle host passes the role to an active player after this long (0 = never)
  reconnectGraceSeconds: 60   # RECONNECT_GRACE_SECONDS: how long a dropped player keeps their seat (0 = off)

limits:                       # connection hygiene
  joinTimeoutSeconds: 10      # JOIN_TIMEOUT_MS: close sockets that never join a room (0 = off, max 600)
  pingIntervalSeconds: 30     # PING_INTERVAL_MS: liveness ping interval (0 = off, max 600)
  maxConnectionsPerIp: 50     # MAX_CONNECTIONS_PER_IP (0 = unlimited)

plugins:                      # optional features installed as plugins (docs/manual/installing-plugins.md)
  dir: ""                     # PLUGINS_DIR: plugins you installed with `plugins install` (empty = a plugins folder inside the data folder)
  bundledDir: dist/plugins    # BUNDLED_PLUGINS_DIR: plugins that come with this version
  enabled: all                # PLUGINS: all | none | a list of plugin ids to load, like [bots]
  bots:                       # settings of the bots plugin (AI players hosts can add to a room)
    allowFill: false          # BOTS_ALLOW_FILL: true lets a room's host fill the empty seats with bots and add bots of a chosen level
    defaultLevel: normal      # BOTS_DEFAULT_LEVEL: level new rooms start with: easy | normal | hard | expert | semigod | random
    mode: embedded            # BOTS_MODE: embedded = this server plays the bots | external = the separate bot server does (needs token)
    token: ""                 # BOTS_TOKEN: secret the bot server presents when it seats bots (its GAME_SERVER_BOT_TOKEN); empty = embedded only
    maxBots: 0                # BOTS_MAX: bots playing at once inside this server; 0 = by PROFILE (LOW_POWER 2, NORMAL 8, HIGH 16)
    decisionHz: 0             # BOTS_DECISION_HZ: decisions per second of an embedded bot; 0 = by PROFILE (LOW_POWER 10, NORMAL 20, HIGH 30)
    mixed: never              # BOTS_MIXED: never | always (bots join rooms that rotate through every game and sit out rounds they cannot play)
    playlistJoin: any         # BOTS_PLAYLIST_JOIN: any | all (custom playlists: join when the bots can play any game of it, or only all of them)
    idleLeaveSeconds: 120     # BOTS_IDLE_LEAVE_SECONDS: seconds a bot may sit out before it leaves; 0 = never
    namePrefix: Bot           # BOTS_NAME_PREFIX: start of the bots' names, like "Bot Hard" (up to 8 letters)
    api: true                 # BOTS_API: serve the management API at /api/bots (admin token); the dashboard needs it
    dashboard: true           # BOTS_DASHBOARD: serve the dashboard page at /plugins/bots/
    liveConfig: true          # BOTS_LIVE_CONFIG: let an admin change the settings that apply here from the dashboard
    audit: true               # BOTS_AUDIT: keep a log of who changed what in the management API
    metrics: false            # BOTS_METRICS: serve Prometheus metrics at /api/bots/prometheus (admin token)
    reports: false            # BOTS_REPORTS: write a report of every bot match (files are written on the game loop: leave off on small machines)
    reportsDir: ""            # BOTS_REPORTS_DIR: where the reports go (empty = the plugin's data folder)
  leaderboard:                # settings of the leaderboard plugin (the /leaderboard page and GET /api/leaderboard; leave it out of plugins.enabled to turn the leaderboard off)
    top: 20                   # LEADERBOARD_TOP: players listed (1-100)
  prometheus:                # settings of the prometheus plugin (GET /metrics for Prometheus, admin token / loopback only)
    enabled: false            # METRICS_ENABLED: true serves GET /metrics; while false nothing is served

branding:                     # how the game presents itself
  name: Party Game            # BRAND_NAME: product name in the menu and browser title (max 40; changeable live in the admin panel)
  welcomeMessage: ""          # WELCOME_MESSAGE: tagline under the name on the main menu (max 140; empty = the built-in translated one; changeable live in the admin panel)

storage:                      # player profiles and stats
  store: json                 # PROFILE_STORE: json | sqlite | memory (memory is lost on restart)
  maxProfiles: 10000          # MAX_PROFILES (any driver)
  recentMatches: 10           # RECENT_MATCHES: past matches each profile keeps for its Recent matches list (0 = keep none, max 50)

  # Settings of each driver sit in a subgroup named after it (ignored unless that store is selected).
  json:
    dataDir: data             # DATA_DIR: directory that holds profiles.json (written atomically)
  sqlite:                     # recommended for real use; needs the optional better-sqlite3 module
    path: data/profiles.db    # SQLITE_PATH: database file (the directory is created)
    busyTimeoutSeconds: 5     # SQLITE_BUSY_TIMEOUT_MS (ms in the env var): wait for a locked database

gamePacks:                    # where the games come from (see docs/manual/installing-games.md)
  dir: ""                     # GAMES_DIR: games you installed with `games install` (empty: "games" inside storage.json.dataDir)
  bundledDir: dist/games      # BUNDLED_GAMES_DIR: games built into this version (`npm run build`)

games:                        # defaults of the options a host can change per game / variant
