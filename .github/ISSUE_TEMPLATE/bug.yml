name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: Version, description: "Shown in the menu or at /status" }
    validations: { required: true }
  - type: dropdown
    id: install
    attributes: { label: Installation, options: [Docker, Linux package, From source] }
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Steps, expected and actual behaviour, device and browser" }
    validations: { required: true }
