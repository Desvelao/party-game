# Companion server for the AI bots (npm run bot:server -- -c bot/server/config.example.yaml).
# Generated by `npm run bot:config:example`; do not edit by hand.
# Precedence: this file > environment variables > defaults. Extra command-line flags beat all of them.
# Settings marked [live] can also be changed while running in the dashboard (Config tab, ADMIN_TOKEN);
# those changes are kept in dataDir/runtime-config.json and win over this file until reset.

gameServer:
  url: "http://localhost:8080"             # GAME_SERVER_URL: the party-game server to serve (http:// or https://); text
  adminToken: ""                           # GAME_SERVER_ADMIN_TOKEN: that server's ADMIN_TOKEN: adds its machine CPU/RAM and live CPU to the dashboard (empty = server.adminToken); text
  botToken: ""                             # GAME_SERVER_BOT_TOKEN: that server's bots.token: lets the bots join rooms whose host asked for bots (empty = only the automatic join of waiting humans); text

server:
  host: "127.0.0.1"                        # BOT_HOST: address of the dashboard/API (beyond loopback needs an admin token); text
  port: 8090                               # BOT_PORT: port of the dashboard/API; 0-65535
  adminToken: ""                           # ADMIN_TOKEN / BOT_TOKEN: bearer token for the dashboard, /api/* and /metrics; empty = this machine only; text
  dataDir: "bot/data"                      # BOT_DATA_DIR: where live settings and the audit log are kept; text

join:
  pollSeconds: 3                           # BOT_POLL_SECONDS [live]: seconds between checks of the game server rooms; 1-300
  botsPerRoom: 1                           # BOT_BOTS_PER_ROOM [live]: bots put into one room; 1-8
  maxBots: 8                               # BOT_MAX_BOTS [live]: bots running at once (lowering it stops no bot, it only blocks new ones); 0-64
  minHumans: 1                             # BOT_MIN_HUMANS [live]: humans a lobby needs before a bot joins (0 = join empty lobbies too); 0-8
  cooldownSeconds: 30                      # BOT_COOLDOWN_SECONDS [live]: seconds a room is left alone after a bot failed to stay in it; 0-3600
  recheckSeconds: 60                       # BOT_RECHECK_SECONDS [live]: seconds before the AI decision for an unchanged room is checked again; 5-3600

ai:
  level: "normal"                          # BOT_LEVEL [live]: default difficulty: easy | normal | hard | expert | semigod | random; text, up to 20 characters
  mixed: "never"                           # BOT_MIXED [live]: also join rooms that rotate through every game (the bot idles in rounds it cannot play); never | always
  playlistJoin: "any"                      # BOT_PLAYLIST_JOIN [live]: custom playlists: join when the AI knows any game of it (it idles in the others) or only when it knows all of them; any | all
  idleLeaveSeconds: 120                    # BOT_IDLE_LEAVE_SECONDS [live]: seconds a bot may sit idle (the room plays a game it has no AI for) before it leaves; 0 = never leaves; 0-86400
  namePrefix: "Bot"                        # BOT_NAME_PREFIX [live]: start of the bots' display names, e.g. "Bot Hard"; text, up to 8 characters
  # levels:  # [live] difficulty per game id, e.g. ballistix: hard (overrides ai.level)
  #   ballistix: hard
  # policies:  # [live] AI policy per game id, e.g. ballistix: greedy
  #   ballistix: greedy
  # params:  # [live] parameter overrides applied on top of the level, e.g. aim: 0.8
  #   aim: 0.8

reports:
  enabled: true                            # BOT_REPORTS [live]: write the per-match report of every bot; true | false
  dir: "bot/reports/companion"             # BOT_REPORTS_DIR: folder of those reports; text

metrics:
  enabled: true                            # BOT_METRICS [live]: serve Prometheus metrics at GET /metrics; true | false
